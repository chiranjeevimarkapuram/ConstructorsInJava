<!DOCTYPE html>
<html>
<head>
<title>Registration Page</title>
</head>
<body style="font-family: Arial; background-color: #f2f2f2;">
	<div
		style="width: 350px; margin: 100px auto; padding: 20px; background-color: white; border-radius: 10px; box-shadow: 0px 0px 10px gray;">

		<h2 style="text-align: center; color: #333;">User Registration</h2>

		<form name="register" method="post" id="Register"
			action="RegisterContoller">

			<label style="font-weight: bold;">Username:</label><br> <input
				type="text" name="username" id="username"
				style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">

			<label style="font-weight: bold;">First Name:</label><br> <input
				type="text" name="firstname" id="firstname"
				style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">


			<label style="font-weight: bold;">Last Name:</label><br> <input
				type="text" name="lastname" id="lastname"
				style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc;">


			<label style="font-weight: bold;">Password:</label><br> <input
				type="password" name="password" id="password"
				style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #ccc;">


			<button type="submit"
				style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
				Register</button>

			<a href="login.html"> AlreadyRegister ..!</a>
		</form>
	</div>
</body>
</html>
